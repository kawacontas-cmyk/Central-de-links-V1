<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060B1F;
    --surface: #0e1530;
    --surface2: #131a38;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #e8eaf6;
    --text-muted: #8b93b8;
    --text-hint: #555f8a;
    --accent: #5b8aff;
    --accent-bg: #0d1a40;

    --cap-bg: #0d2040; --cap-text: #7ab8ff;
    --obg-bg: #0a2218; --obg-text: #5fcd8a;
    --vnd-bg: #231500; --vnd-text: #ffb94a;
    --pesq-bg: #250a1a; --pesq-text: #f07ab0;
    --aula-bg: #160d30; --aula-text: #a98bff;
    --outro-bg: #111520; --outro-text: #7a83a8;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: #060B1F;
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }
  .logo-sep {
    width: 1px;
    height: 22px;
    background: rgba(255,255,255,0.15);
  }
  .logo-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #CDA04C;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-hint);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--surface2);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); background: var(--surface); }

  .count-badge {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem 2rem 3rem;
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 2rem;
    align-items: start;
  }

  .sidebar {
    position: sticky;
    top: 90px;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-hint);
    margin-bottom: 8px;
  }

  .nav-list { list-style: none; }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
    gap: 6px;
  }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .nav-count {
    font-size: 11px;
    background: var(--surface2);
    color: var(--text-hint);
    padding: 1px 6px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }
  .nav-item.active .nav-count { background: #d0daff; color: var(--accent); }

  .legend {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .content {}

  .section { margin-bottom: 2rem; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    transition: margin-bottom 0.2s ease;
  }
  .section.collapsed .section-header { margin-bottom: 0; }
  .section-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .section-line { flex: 1; height: 1px; background: var(--border); }
  .section-total { font-size: 12px; color: var(--text-hint); }

  .section-header { cursor: pointer; user-select: none; }
  .section-header:hover .section-name { color: var(--text); }

  .chevron {
    width: 16px; height: 16px;
    color: var(--text-hint);
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }
  .section.collapsed .chevron { transform: rotate(-90deg); }

  .grid-wrap {
    overflow: hidden;
    transition: max-height 0.28s ease, opacity 0.2s ease;
    max-height: 4000px;
    opacity: 1;
  }
  .section.collapsed .grid-wrap { max-height: 0; opacity: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: border-color 0.15s, box-shadow 0.15s;
    text-decoration: none;
  }
  .card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .card-top { display: flex; align-items: center; gap: 8px; }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 99px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-cap  { background: var(--cap-bg);  color: var(--cap-text); }
  .badge-obg  { background: var(--obg-bg);  color: var(--obg-text); }
  .badge-vnd  { background: var(--vnd-bg);  color: var(--vnd-text); }
  .badge-pesq { background: var(--pesq-bg); color: var(--pesq-text); }
  .badge-aula { background: var(--aula-bg); color: var(--aula-text); }
  .badge-outro{ background: var(--outro-bg);color: var(--outro-text);}

  .card-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .card-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-hint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    color: var(--text-muted);
    font-size: 14px;
    padding: 3rem 0;
    text-align: center;
    grid-column: 1/-1;
  }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    header { padding: 1rem; }
    .main { padding: 1rem 1rem 3rem; }
    .header-inner { gap: 1rem; }
  }
</style>

  {label:"Edema Pulmonar – Pg Vendas ORG",url:"https://kaleizurosa.com/edema-pulmonar-pagina-de-vendas-org/",grupo:"Edema Pulmonar",tipo:"vnd"},
  {label:"Edema Pulmonar – Pg Vendas LATAM",url:"https://kaleizurosa.com/edema-pulmonar-pagina-de-vendas-latam/",grupo:"Edema Pulmonar",tipo:"vnd"},
  {label:"Edema Pulmonar – Pg Vendas v3 [Nova]",url:"https://kaleizurosa.com/edemapulmonar-v3/",grupo:"Edema Pulmonar",tipo:"vnd"},
  {label:"Edema Pulmonar – Pg Vendas v2",url:"https://kaleizurosa.com/edema2/",grupo:"Edema Pulmonar",tipo:"vnd"},
  {label:"Edema Pulmonar – Pg Vendas",url:"https://kaleizurosa.com/edema/",grupo:"Edema Pulmonar",tipo:"vnd"},
  {label:"Edema Pulmonar Cardiogênico",url:"https://kaleizurosa.com/edema-pulmonar-cardiogenico/",grupo:"Edema Pulmonar",tipo:"outro"},
  {label:"[ECV] Funil Edema",url:"https://kaleizurosa.com/ecv-funil-edema/",grupo:"Edema Pulmonar",tipo:"outro"},
  {label:"Hipertensão – Pg Vendas ORG",url:"https://kaleizurosa.com/hipertensao-pagina-de-vendas-org/",grupo:"Hipertensão",tipo:"vnd"},
  {label:"Hipertensão – Pg Vendas",url:"https://kaleizurosa.com/hipertensao/",grupo:"Hipertensão",tipo:"vnd"},
  {label:"[CVCE] Funil Hipertensão",url:"https://kaleizurosa.com/cvce-funil-hipertensao/",grupo:"Hipertensão",tipo:"outro"},
  {label:"[Comercial] Página Vendas Pós",url:"https://kaleizurosa.com/pv-comercial/",grupo:"Comercial",tipo:"vnd"},
  {label:"[Comercial] Página de Vendas | Clínica",url:"https://kaleizurosa.com/posclinica-comercial/",grupo:"Comercial",tipo:"vnd"},
  {label:"[Comercial][OBG] Página Vendas Pós",url:"https://kaleizurosa.com/obg-comercial/",grupo:"Comercial",tipo:"obg"},
  {label:"[Pós Clínica] PG para o Comercial",url:"https://kaleizurosa.com/pos-clinica-comercial/",grupo:"Comercial",tipo:"outro"},
  {label:"[Pós Cardio] PG para o Comercial",url:"https://kaleizurosa.com/pos-cardio-comercial/",grupo:"Comercial",tipo:"outro"},
];

const tipoInfo = {
  cap:  {label:"Captura",  cls:"badge-cap"},
  obg:  {label:"Obrigado", cls:"badge-obg"},
  vnd:  {label:"Vendas",   cls:"badge-vnd"},
  pesq: {label:"Pesquisa", cls:"badge-pesq"},
  aula: {label:"Aula",     cls:"badge-aula"},
  outro:{label:"Outros",   cls:"badge-outro"},
};

const allGroups = [...new Set(links.map(l => l.grupo))];
let activeGrupo = "Todos";
const collapsedGroups = new Set(allGroups);

function toggleSection(grupo, id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (collapsedGroups.has(grupo)) {
    collapsedGroups.delete(grupo);
    el.classList.remove("collapsed");
  } else {
    collapsedGroups.add(grupo);
    el.classList.add("collapsed");
  }
}

function renderNav(filtered) {
  const counts = {};
  filtered.forEach(l => { counts[l.grupo] = (counts[l.grupo] || 0) + 1; });
  const total = filtered.length;
  const nav = document.getElementById("nav");
  const grupos = ["Todos", ...allGroups];
  nav.innerHTML = grupos.map(g => {
    const n = g === "Todos" ? total : (counts[g] || 0);
    if (g !== "Todos" && n === 0) return "";
    return `<li class="nav-item${activeGrupo===g?" active":""}" onclick="setGrupo('${g.replace(/'/g,"&#39;")}')">${g}<span class="nav-count">${n}</span></li>`;
  }).join("");
}

function setGrupo(g) {
  activeGrupo = g;
  if (g === "Todos") {
    allGroups.forEach(grupo => collapsedGroups.add(grupo));
  } else {
    collapsedGroups.clear();
  }
  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const allFiltered = links.filter(l =>
    !q || l.label.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)
  );
  const filtered = allFiltered.filter(l =>
    activeGrupo === "Todos" || l.grupo === activeGrupo
  );

  renderNav(allFiltered);
  document.getElementById("count").textContent = filtered.length + " links";

  const byGroup = {};
  filtered.forEach(l => {
    if (!byGroup[l.grupo]) byGroup[l.grupo] = [];
    byGroup[l.grupo].push(l);
  });

  const content = document.getElementById("content");
  if (!filtered.length) {
    content.innerHTML = '<p class="empty">Nenhum link encontrado.</p>';
    return;
  }

  content.innerHTML = Object.entries(byGroup).map(([grupo, items]) => {
    const id = "sec-" + grupo.replace(/\s+/g,"_");
    const isCollapsed = collapsedGroups.has(grupo);
    return `
    <div class="section${isCollapsed?" collapsed":""}" id="${id}">
      <div class="section-header" onclick="toggleSection('${grupo.replace(/'/g,"&#39;")}','${id}')">
        <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,6 8,10 12,6"/></svg>
        <span class="section-name">${grupo}</span>
        <span class="section-line"></span>
        <span class="section-total">${items.length}</span>
      </div>
      <div class="grid-wrap"><div class="grid">${items.map(l => {
        const t = tipoInfo[l.tipo];
        const slug = l.url.replace("https://kaleizurosa.com","") || "/";
        return `<a class="card" href="${l.url}" target="_blank" rel="noopener">
          <div class="card-top">
            <span class="badge ${t.cls}">${t.label}</span>
            <span class="card-label" title="${l.label}">${l.label}</span>
          </div>
          <span class="card-url">${slug}</span>
        </a>`;
      }).join("")}</div></div>
    </div>`;
  }).join("");
}

render();
</script>
</body>
</html>
