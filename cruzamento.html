<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060B1F;
  --surface: #0e1530;
  --surface2: #131a38;
  --card: #0f1428;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --text: #e8eaf6;
  --muted: #8b93b8;
  --hint: #3a4060;
  --gold: #CDA04C;
  --gold-light: #e8c97a;
  --gold-dim: rgba(205,160,76,0.12);
  --teal: #7cc4a8;
  --danger: #e05a5a;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --r: 8px;
  --r2: 12px;
}

body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ── TOPBAR ── */
.topbar {
  height: 56px; background: #0a0e1f;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 14px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.topbar-logo img { width: 32px; height: 32px; object-fit: contain; mix-blend-mode: lighten; }
.topbar-name { font-size: 14px; font-weight: 500; color: var(--gold); padding-left: 10px; border-left: 1px solid var(--border); white-space: nowrap; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn-topbar {
  background: none; border: 1px solid var(--border);
  border-radius: var(--r); padding: 6px 14px;
  font-size: 12px; color: var(--muted); cursor: pointer;
  font-family: var(--font); transition: all .15s;
}
.btn-topbar:hover { color: var(--text); border-color: var(--gold); }
.btn-topbar.gold { border-color: rgba(205,160,76,0.4); color: var(--gold); }
.btn-topbar.gold:hover { background: var(--gold-dim); }

/* ── MAIN ── */
.main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

/* ── PAGE HEADER ── */
.page-header { margin-bottom: 24px; }
.page-title { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--muted); }

/* ── PRODUCT TOGGLE ── */
.section-label {
  font-size: 10px; font-family: var(--mono); color: var(--gold);
  letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 10px;
}
.product-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.ptab {
  padding: 7px 16px; border: 1px solid var(--border);
  border-radius: 99px; background: var(--surface);
  cursor: pointer; font-size: 12px; color: var(--muted);
  transition: all .15s; font-family: var(--font);
}
.ptab:hover { border-color: var(--gold-light); color: var(--gold-light); }
.ptab.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-light); font-weight: 500; }

/* ── CATEGORY TABS ── */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.tab {
  padding: 6px 14px; border: 1px solid var(--border);
  border-radius: var(--r); background: var(--surface);
  cursor: pointer; font-size: 12px; color: var(--muted);
  transition: all .15s; font-family: var(--font);
}
.tab:hover { border-color: var(--border-hover); color: var(--text); }
.tab.active { background: var(--surface2); border-color: var(--gold); color: var(--gold-light); font-weight: 500; }

/* ── METRICS ── */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.metric {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r2); padding: 16px;
  border-top: 2px solid var(--gold);
}
.metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--mono); margin-bottom: 6px; }
.metric-value { font-size: 26px; font-weight: 500; color: var(--gold-light); letter-spacing: -.5px; line-height: 1; }
.metric-sub { font-size: 11px; color: var(--hint); margin-top: 4px; font-family: var(--mono); }

/* ── CHART CARD ── */
.chart-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r2); padding: 20px 22px;
}
.legend {
  display: flex; gap: 16px; margin-bottom: 18px;
  font-size: 12px; color: var(--muted); flex-wrap: wrap;
}
.legend span { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
.chart-wrap { position: relative; width: 100%; }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--border); margin: 24px 0; }
</style>

function buildProductToggle() {
  const container = document.getElementById('product-toggle');
  PRODUCTS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'ptab' + (selectedProducts.has(p.id) ? ' active' : '');
    btn.textContent = p.name;
    btn.onclick = () => {
      if (selectedProducts.has(p.id)) {
        if (selectedProducts.size === 1) return;
        selectedProducts.delete(p.id);
        btn.classList.remove('active');
      } else {
        selectedProducts.add(p.id);
        btn.classList.add('active');
      }
      render();
    };
    container.appendChild(btn);
  });
}

function setCategory(c) {
  currentCategory = c;
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes("'" + c + "'"));
  });
  render();
}

function renderMetrics() {
  const el = document.getElementById('metrics-row');
  const selected = PRODUCTS.filter(p => selectedProducts.has(p.id));
  if (selected.length === 1) {
    const d = selected[0];
    const ratio = ((d.total_buyers / d.total_leads) * 100).toFixed(1);
    el.innerHTML = `
      <div class="metric"><div class="metric-label">Total de leads</div><div class="metric-value">${d.total_leads.toLocaleString('pt-BR')}</div></div>
      <div class="metric"><div class="metric-label">Compradores</div><div class="metric-value">${d.total_buyers}</div></div>
      <div class="metric"><div class="metric-label">Taxa de conversão</div><div class="metric-value">${ratio}%</div></div>
    `;
  } else {
    el.innerHTML = selected.map(d => {
      const ratio = ((d.total_buyers / d.total_leads) * 100).toFixed(1);
      return `<div class="metric">
        <div class="metric-label">${d.name}</div>
        <div class="metric-value" style="font-size:20px">${d.total_leads.toLocaleString('pt-BR')} <span style="font-size:13px;color:var(--hint)">leads</span></div>
        <div class="metric-sub">${d.total_buyers} compradores · ${ratio}% conversão</div>
      </div>`;
    }).join('');
  }
}

function renderLegend() {
  const el = document.getElementById('legend-row');
  const selected = PRODUCTS.filter(p => selectedProducts.has(p.id));
  if (selected.length === 1) {
    el.innerHTML = `
      <span><span class="legend-dot" style="background:${PALETTES[0].lb}"></span>Leads (Captação)</span>
      <span><span class="legend-dot" style="background:${PALETTES[0].bb}"></span>Compradores</span>
    `;
  } else {
    el.innerHTML = selected.map((p, i) => {
      const pal = PALETTES[i % PALETTES.length];
      return `
        <span><span class="legend-dot" style="background:${pal.lb}"></span>${p.name} — Leads</span>
        <span><span class="legend-dot" style="background:${pal.bb}"></span>${p.name} — Compradores</span>
      `;
    }).join('');
  }
}

function renderChart() {
  const wrap = document.getElementById('chart-wrap');
  if (chart) { chart.destroy(); chart = null; }
  wrap.innerHTML = '<canvas id="mainChart" role="img" aria-label="Gráfico comparativo"></canvas>';

  const selected = PRODUCTS.filter(p => selectedProducts.has(p.id));
  const labels = selected[0][currentCategory].labels;
  const datasets = [];
  datasetsCountsRef = [];

  selected.forEach((p, i) => {
    const pal = PALETTES[i % PALETTES.length];
    const d = p[currentCategory];
    datasets.push({ label: `${p.name} — Leads`,       data: d.leads,  backgroundColor: pal.leads,  borderColor: pal.lb, borderWidth: 1, borderRadius: 3 });
    datasetsCountsRef.push(d.leads_n);
    datasets.push({ label: `${p.name} — Compradores`, data: d.buyers, backgroundColor: pal.buyers, borderColor: pal.bb, borderWidth: 1, borderRadius: 3 });
    datasetsCountsRef.push(d.buyers_n);
  });

  const barH = Math.max(labels.length * (selected.length > 1 ? 72 : 52) + 80, 220);
  wrap.style.height = barH + 'px';

  chart = new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f1428',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          titleColor: '#e8eaf6',
          bodyColor: '#8b93b8',
          padding: 10,
          callbacks: {
            label: ctx => {
              const pct = ctx.parsed.x.toFixed(1);
              const n = datasetsCountsRef[ctx.datasetIndex]?.[ctx.dataIndex] ?? '—';
              return ` ${ctx.dataset.label}: ${pct}%  (n = ${n})`;
            }
          }
        }
      },
      scales: {
        x: {
          max: 100,
          ticks: { callback: v => v + '%', font: { size: 11, family: "'DM Mono', monospace" }, color: '#3a4060' },
          grid: { color: 'rgba(255,255,255,0.04)' },
          border: { color: 'rgba(255,255,255,0.06)' }
        },
        y: {
          ticks: { font: { size: 11, family: "'DM Sans', sans-serif" }, color: '#8b93b8', autoSkip: false },
          grid: { display: false },
          border: { color: 'rgba(255,255,255,0.06)' }
        }
      }
    }
  });
}

function render() {
  renderMetrics();
  renderLegend();
  renderChart();
}

buildProductToggle();
render();
</script>
</body>
</html>
